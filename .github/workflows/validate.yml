name: Build and test
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/AutoRender.Tests/AutoRender.Tests.csproj -c Release
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/AutoRender.App/AutoRender.App.csproj -c Release
      - run: dotnet test tests/AutoRender.Tests/AutoRender.Tests.csproj -c Release
