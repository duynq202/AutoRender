name: Build RenderBatch
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/RenderBatch.Tests/RenderBatch.Tests.csproj -c Release
      - run: dotnet build src/RenderBatch.Windows/RenderBatch.Windows.csproj -c Release
      - if: runner.os == 'Windows'
        run: dotnet publish src/RenderBatch.Windows/RenderBatch.Windows.csproj -c Release -r win-x64 --self-contained true -o artifacts/windows
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: RenderBatch-Windows-x64
          path: artifacts/windows/
